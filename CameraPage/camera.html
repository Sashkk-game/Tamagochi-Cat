<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Камера для поделки</title>
    <style>
        body { margin: 0; overflow: hidden; }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover;
            position: fixed;
            top: 0;
            left: 0;
        }
        .btn {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 20px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <button class="btn" onclick="captureAndClose()">Поделка готова</button>
    <script>
        let stream = null;
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('video').srcObject = stream;
            } catch(err) {
                alert('Не удалось открыть камеру: ' + err.message);
                setTimeout(() => window.close(), 1000);
            }
        }
        function captureAndClose() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            window.location.href = 'index.html';
        }
        startCamera();
    </script>
</body>
</html>
